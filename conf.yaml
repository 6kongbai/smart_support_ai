DEFAULTS:
  CHAT: deepseek-chat
  REASONING: deepseek-reasoner
  EMBEDDING: text-embedding-v4
  ROUTER: router-lite
  FUNCTION_CALL: function-calling

PROVIDERS:
  DASHSCOPE:
    BASE_URL: ${DASHSCOPE_BASE_URL}
    API_KEY: ${DASHSCOPE_API_KEY}

  OPENAI:
    BASE_URL: ${OPENAI_BASE_URL}
    API_KEY: ${OPENAI_API_KEY}

  DEEPSEEK:
    BASE_URL: ${DEEPSEEK_BASE_URL}
    API_KEY: ${DEEPSEEK_API_KEY}

  GEMINI:
    BASE_URL: ${GEMINI_BASE_URL}
    API_KEY: ${GEMINI_API_KEY}


MODELS:
  # --- 常规对话模型 ---
  deepseek-chat:
    TYPE: "chat"
    PROVIDER: DEEPSEEK
    temperature: 1.3

  deepseek-reasoner:
    TYPE: "chat"
    PROVIDER: DEEPSEEK

  qwen-max:
    TYPE: "chat"
    PROVIDER: DASHSCOPE

  gpt-4o-mini:
    TYPE: "chat"
    PROVIDER: OPENAI

  # --- 路由专用配置 (特殊配置) ---
  router-lite:
    TYPE: "chat"
    PROVIDER: OPENAI
    MODEL_NAME: "gpt-5.1"
    temperature: 0

  function-calling:
    TYPE: "chat"
    PROVIDER: OPENAI
    MODEL_NAME: "gpt-5.1"
    temperature: 0.1

  # --- Embedding ---
  text-embedding-v4:
    TYPE: "embedding"
    PROVIDER: DASHSCOPE


