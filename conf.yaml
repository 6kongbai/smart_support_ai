DEFAULTS:
  CHAT: deepseek-chat
  REASONING: deepseek-reasoner
  EMBEDDING: text-embedding-v4
  ROUTER: router-lite

PROVIDERS:
  DASHSCOPE:
    BASE_URL: $DASHSCOPE_BASE_URL
    API_KEY: $DASHSCOPE_API_KEY

  OPENAI:
    BASE_URL: $OPENAI_BASE_URL
    API_KEY: $OPENAI_API_KEY

  DEEPSEEK:
    BASE_URL: $DEEPSEEK_BASE_URL
    API_KEY: $DEEPSEEK_API_KEY


MODELS:
  # --- 常规对话模型 ---
  deepseek-chat:
    TYPE: "chat"
    PROVIDER: DEEPSEEK
    temperature: 1.3

  deepseek-reasoner:
    TYPE: "chat"
    PROVIDER: DEEPSEEK

  qwen-max:
    TYPE: "chat"
    PROVIDER: DASHSCOPE

  gpt-4o-mini:
    TYPE: "chat"
    PROVIDER: OPENAI

  # --- 路由专用配置 (特殊配置) ---
  router-lite:
    TYPE: "chat"
    PROVIDER: DEEPSEEK
    MODEL_NAME: "deepseek-chat"
    temperature: 0

  # --- Embedding ---
  text-embedding-v4:
    TYPE: "embedding"
    PROVIDER: DASHSCOPE


